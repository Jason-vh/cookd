<!-- A plated pizza, in the palette of the kitchen it came out of. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>cookd</title>
  <rect width="32" height="32" rx="7" fill="#4a453e" />
  <!-- Plate: ceramic disc inside the dusty-teal enamel band. -->
  <circle cx="16" cy="16" r="12.4" fill="#7f9ba0" />
  <circle cx="16" cy="16" r="10.8" fill="#f1ece0" />
  <!-- Pizza: baked crust, sauce, cheese, pepperoni. Nothing quite centred. -->
  <g transform="rotate(-7 16 16)">
    <circle cx="16.2" cy="16.1" r="7.5" fill="#c09059" />
    <circle cx="16.2" cy="16.1" r="6" fill="#b45340" />
    <circle cx="14.4" cy="14.1" r="1.5" fill="#e6c069" />
    <circle cx="18.3" cy="17.9" r="1.3" fill="#e6c069" />
    <circle cx="18.6" cy="13.7" r="1.5" fill="#9d5344" />
    <circle cx="13.5" cy="18" r="1.4" fill="#9d5344" />
  </g>
  <!-- Enamel sheen: one soft highlight across the rim. -->
  <path d="M7.6 11.2a10.8 10.8 0 0 1 7.4-5.7" fill="none" stroke="#ffffff" stroke-opacity="0.35"
    stroke-width="1.6" stroke-linecap="round" />
</svg>
