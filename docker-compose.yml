services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      COOKD_SAVE_DIR: /app/saves
    volumes:
      # Kitchens survive deploys. Every push rebuilds the container, and a
      # bind-free named volume is the difference between "your layout is still
      # there" and "everyone starts again on Tuesday".
      - cookd-saves:/app/saves
    ports:
      # Deliberately not loopback. The exe.dev proxy reaches the VM over eth0,
      # so a 127.0.0.1 binding would be visible to nothing but the VM itself.
      - "${COOKD_APP_HOST_PORT:-3010}:3000"

volumes:
  cookd-saves:
